<html lang="ja">

<title>簿記3級 30日</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-column phone app — ledger-paper ground, white sheets for work, fixed bottom tab bar. 借方=blue ink, 貸方=red ink. */
:root{
  --paper:#EEF2EE; --card:#FFFFFF; --ink:#1B2A30; --muted:#5D6D6C; --rule:#D3DCD6;
  --accent:#16705A; --accent-ink:#FFFFFF; --accent-soft:#DCEDE5;
  --debit:#1F55A8; --credit:#B3402B; --ok:#17803D; --ok-soft:#E1F2E6; --ng:#C2362B; --ng-soft:#FBE7E4;
  --warn:#9A6A00; --stamp:#C8372D;
  --font:"Zen Kaku Gothic New",system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111816; --card:#1A2321; --ink:#E3ECE8; --muted:#93A4A0; --rule:#2D3B38;
  --accent:#4DBE98; --accent-ink:#0D1B16; --accent-soft:#1B3A30;
  --debit:#86AEF2; --credit:#F2927B; --ok:#5ACB7F; --ok-soft:#173523; --ng:#F07A6E; --ng-soft:#3B1C19;
  --warn:#E2B44A; --stamp:#F0614F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111816; --card:#1A2321; --ink:#E3ECE8; --muted:#93A4A0; --rule:#2D3B38;
  --accent:#4DBE98; --accent-ink:#0D1B16; --accent-soft:#1B3A30;
  --debit:#86AEF2; --credit:#F2927B; --ok:#5ACB7F; --ok-soft:#173523; --ng:#F07A6E; --ng-soft:#3B1C19;
  --warn:#E2B44A; --stamp:#F0614F; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:900;letter-spacing:.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sheet{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px;min-width:0}
.sheet.flat{border-radius:10px;padding:12px 14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.btn.block{width:100%}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.btn.danger{background:var(--ng);color:#fff}
.btn:disabled{opacity:.45}
.ghost{color:var(--accent);font-weight:700;padding:8px 4px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ng{background:var(--ng-soft);color:var(--ng)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.plain{background:transparent;border:1px solid var(--rule);color:var(--muted)}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.daybig{font-family:var(--num);font-size:44px;font-weight:600;line-height:1;letter-spacing:-.02em}
.daybig small{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px}
.sync{font-size:11px;color:var(--muted)}
.meter{height:8px;background:var(--rule);border-radius:99px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--num);font-size:20px;font-weight:600;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}

/* tasks */
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.task:first-of-type{border-top:0}
.task .box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--rule);display:grid;place-items:center;font-size:15px;color:var(--accent-ink)}
.task.done .box{background:var(--accent);border-color:var(--accent)}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-weight:700;line-height:1.4}
.task .tt span{font-size:12px;color:var(--muted)}
.task.done .tt b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.go{flex:none;min-height:38px;padding:0 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--paper);border:1px solid var(--rule);font-family:var(--num);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;position:relative}
.cal button small{font-family:var(--font);font-size:9px;color:var(--muted);font-weight:500;margin-top:2px}
.cal button.full{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cal button.full small{color:var(--accent-ink);opacity:.8}
.cal button.part{background:var(--accent-soft);border-color:var(--accent-soft)}
.cal button.today{outline:2px solid var(--ink);outline-offset:1px}
.cal button.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.mock::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--stamp)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--muted);font-weight:500}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent);font-weight:700}

/* lessons */
.lesson{font-size:15.5px;line-height:1.85}
.lesson h3{margin-top:22px;margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid var(--accent-soft)}
.lesson p{margin:8px 0}
.lesson ul,.lesson ol{margin:8px 0;padding-left:1.3em}
.lesson li{margin:3px 0}
.lesson strong{color:var(--accent);font-weight:700}
.lesson .tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14.5px}
.lesson .tip b:first-child{display:block;color:var(--accent);font-size:12px;letter-spacing:.1em}
.lesson .warn{background:var(--ng-soft);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14.5px}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:0}
.tbl th,.tbl td{border:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--paper);font-weight:700;white-space:nowrap}
.tbl td.r{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.unit{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);width:100%;text-align:left}
.unit:first-child{border-top:0}
.unit .n{flex:none;width:38px;height:38px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:13px;color:var(--muted)}
.unit.read .n{background:var(--accent);color:var(--accent-ink)}
.unit .tt{flex:1;min-width:0}
.unit .tt b{display:block;font-weight:700;line-height:1.4}
.unit .tt span{font-size:12px;color:var(--muted)}

/* journal display */
.jt{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.jt th{font-size:11px;font-weight:700;padding:3px 6px;text-align:left;border-bottom:1.5px solid var(--ink)}
.jt th.d{color:var(--debit)} .jt th.c{color:var(--credit)}
.jt td{padding:4px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
.jt td.a{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.jt td.sep{border-left:1.5px solid var(--ink)}
.jwrap{overflow-x:auto}

/* journal form */
.qtext{font-size:16px;line-height:1.8}
.jform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jside{min-width:0;display:flex;flex-direction:column;gap:8px}
.jside-h{font-size:12px;font-weight:700;letter-spacing:.15em;padding-bottom:4px;border-bottom:2px solid currentColor}
.jside.d .jside-h{color:var(--debit)} .jside.c .jside-h{color:var(--credit)}
.jrow{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px dashed var(--rule)}
select,input.in{width:100%;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:9px;min-height:42px;padding:0 8px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 18px,calc(100% - 8px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
input.in{font-family:var(--num);text-align:right;font-variant-numeric:tabular-nums}
input.in.wide{text-align:right}
select:disabled,input:disabled{opacity:.8}
.fb{border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-soft)} .fb.ng{background:var(--ng-soft)}
.fb .verdict{font-weight:900;font-size:18px}
.fb.ok .verdict{color:var(--ok)} .fb.ng .verdict{color:var(--ng)}
.exp{font-size:14.5px;line-height:1.8}
.progress{display:flex;align-items:center;gap:10px}
.progress .meter{flex:1}

/* choice chips */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;font-size:14px;background:var(--paper);min-height:40px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}

/* statements */
.fs{display:flex;flex-direction:column}
.fs .fh{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);padding:12px 0 4px;border-bottom:1.5px solid var(--ink)}
.fs .fl{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--rule);min-height:44px}
.fs .fl .lab{min-width:0;font-size:14px}
.fs .fl .val{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.fs .fl.indent .lab{padding-left:1em;color:var(--muted)}
.fs .fl.bl input{border-color:var(--accent)}
.fs .fl.right input{border-color:var(--ok);background:var(--ok-soft)}
.fs .fl.wrong input{border-color:var(--ng);background:var(--ng-soft)}
.ans-note{display:block;font-size:12px;color:var(--ng);font-family:var(--num)}
.adj{counter-reset:a;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.adj li{counter-increment:a;display:grid;grid-template-columns:24px 1fr;gap:6px;font-size:14.5px;line-height:1.7}
.adj li::before{content:counter(a);font-family:var(--num);font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;height:22px;display:grid;place-items:center;font-size:12px;margin-top:3px}

/* T account */
.tacc{border-top:2px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;margin-top:6px}
.tacc>div{padding:6px 0;min-width:0}
.tacc>div:first-child{border-right:2px solid var(--ink);padding-right:8px}
.tacc>div:last-child{padding-left:8px}
.tacc .ttl{text-align:center;font-weight:700;margin-bottom:-2px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:4px;align-items:center;font-size:13px;margin:4px 0}
.tline .lab{color:var(--muted);font-size:12px;line-height:1.3}
.tline .v{text-align:right;font-family:var(--num)}
.tline input{min-height:36px;font-size:14px}

/* mock */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);padding:8px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
body.mocking::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--paper)}
.timer{font-family:var(--num);font-size:22px;font-weight:600}
.timer.low{color:var(--ng)}
.qnav{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.qnav::-webkit-scrollbar{display:none}
.qnav button{flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:9px;border:1.5px solid var(--rule);background:var(--card);font-family:var(--num);font-size:13px;font-weight:600}
.qnav button.filled{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.qnav button.cur{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.qnav button.big{font-family:var(--font);font-size:12px}

/* result stamp */
.result{position:relative;overflow:hidden}
.score{font-family:var(--num);font-size:64px;font-weight:600;line-height:1}
.score small{font-size:20px;color:var(--muted)}
.hanko{position:absolute;right:14px;top:14px;width:104px;height:104px;border-radius:50%;border:5px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font-weight:900;font-size:30px;transform:rotate(-14deg);letter-spacing:.08em;opacity:.92}
.hanko.fail{border-style:dashed;font-size:22px;opacity:.75}
@media (prefers-reduced-motion:no-preference){.hanko{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both .2s}@keyframes stamp{from{transform:rotate(-14deg) scale(1.8);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.92}}}
.bar{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;font-size:13px;min-height:28px}
.bar .meter{height:10px}
.bar .meter>i.lo{background:var(--ng)} .bar .meter>i.mid{background:var(--warn)}
.rv{border-top:1px solid var(--rule);padding:10px 0}
.rv summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.spark{width:100%;height:120px;display:block}
.confirm{background:var(--ng-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.fld input{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--rule);border-radius:9px;min-height:44px;padding:0 10px}
</style>

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<nav class="tabs" id="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>ホーム</button>
  <button data-tab="learn"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>講義</button>
  <button data-tab="drill"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 7l3 3"/></svg>演習</button>
  <button data-tab="mock"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>模試</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>記録</button>
</nav>

<script>
"use strict";
/* ============ 勘定科目 ============ */
const CAT={};
[["資産","現金,小口現金,当座預金,普通預金,定期預金,受取手形,売掛金,クレジット売掛金,電子記録債権,繰越商品,前払金,未収入金,貸付金,手形貸付金,役員貸付金,仮払金,従業員立替金,受取商品券,仮払消費税,仮払法人税等,差入保証金,前払保険料,前払家賃,未収利息,未収家賃,貯蔵品,建物,備品,車両運搬具,土地"],
 ["負債","買掛金,支払手形,電子記録債務,前受金,未払金,借入金,手形借入金,仮受金,所得税預り金,社会保険料預り金,仮受消費税,未払消費税,未払法人税等,未払配当金,未払家賃,未払利息,前受地代,前受家賃,当座借越"],
 ["純資産","資本金,利益準備金,繰越利益剰余金"],
 ["収益","売上,受取利息,受取手数料,受取家賃,受取地代,雑益,償却債権取立益,貸倒引当金戻入,固定資産売却益"],
 ["費用","仕入,売上原価,給料,法定福利費,発送費,広告宣伝費,旅費交通費,通信費,消耗品費,水道光熱費,支払家賃,保険料,租税公課,修繕費,支払手数料,支払利息,雑損,貸倒損失,貸倒引当金繰入,減価償却費,固定資産売却損,法人税等"],
 ["その他","現金過不足,損益,貸倒引当金,建物減価償却累計額,備品減価償却累計額,車両運搬具減価償却累計額"]
].forEach(([c,l])=>l.split(",").forEach(a=>CAT[a]=c));

lesson("L1","簿記のしくみと5要素","借方・貸方と仕訳のルール",[],`
<h3>簿記ってなに？</h3>
<p>会社のお金やモノの動き（<strong>取引</strong>）を記録して、年に1回の<strong>決算</strong>で2つの表を作る技術です。</p>
<ul><li><strong>貸借対照表（B/S）</strong>…決算日の財政状態（何をどれだけ持ち、どれだけ借りているか）</li><li><strong>損益計算書（P/L）</strong>…1年間の経営成績（いくら稼いでいくら使い、いくら儲けたか）</li></ul>
<h3>5つのグループ</h3>
<div class="tbl"><table><tr><th>要素</th><th>意味</th><th>例</th></tr>
<tr><td>資産</td><td>持っている財産・権利</td><td>現金、普通預金、売掛金、建物</td></tr>
<tr><td>負債</td><td>将来払う義務</td><td>買掛金、借入金、未払金</td></tr>
<tr><td>純資産</td><td>資産−負債（元手と儲けの蓄積）</td><td>資本金、繰越利益剰余金</td></tr>
<tr><td>収益</td><td>儲けの源</td><td>売上、受取利息、受取手数料</td></tr>
<tr><td>費用</td><td>収益を得るためのコスト</td><td>仕入、給料、支払家賃</td></tr></table></div>
<p>B/S：<strong>資産＝負債＋純資産</strong>　P/L：<strong>収益−費用＝当期純利益</strong></p>
<h3>仕訳のルール（最重要）</h3>
<p>取引を左（<strong>借方</strong>）と右（<strong>貸方</strong>）に分けて書くのが<strong>仕訳</strong>。どちらに書くかは、5要素の「ホームポジション」で決まります。</p>
<div class="tbl"><table><tr><th></th><th>増えたら</th><th>減ったら</th></tr>
<tr><td>資産</td><td>借方（左）</td><td>貸方（右）</td></tr>
<tr><td>費用</td><td>借方（左）</td><td>―</td></tr>
<tr><td>負債</td><td>貸方（右）</td><td>借方（左）</td></tr>
<tr><td>純資産</td><td>貸方（右）</td><td>借方（左）</td></tr>
<tr><td>収益</td><td>貸方（右）</td><td>―</td></tr></table></div>
<div class="tip"><b>覚え方</b>B/Sの左側にいる「資産」とP/Lの左側にいる「費用」は、増えたら左。それ以外は増えたら右。</div>
<h3>例：商品を売って現金をもらった</h3>
<p>現金（資産）が増えた→借方。売上（収益）が発生→貸方。</p>
[[現金:10000/売上:10000]]
<p>借方の合計と貸方の合計は<strong>必ず一致</strong>します。</p>
<h3>仕訳のあとの流れ</h3>
<p>仕訳帳に仕訳 → 総勘定元帳の各勘定に<strong>転記</strong> → 試算表で確認 → 決算整理 → 財務諸表。</p>
<h3>試験の形（ネット試験・統一試験共通）</h3>
<div class="tbl"><table><tr><th>大問</th><th>内容</th><th>配点</th></tr>
<tr><td>第1問</td><td>仕訳15問</td><td>45点</td></tr>
<tr><td>第2問</td><td>勘定記入・補助簿・語句など</td><td>20点</td></tr>
<tr><td>第3問</td><td>決算（財務諸表・精算表・決算整理後残高試算表）</td><td>35点</td></tr></table></div>
<p>試験時間60分、<strong>70点以上で合格</strong>。仕訳がすべての土台なので、このアプリは前半で仕訳を固め、後半で決算と模試を繰り返します。</p>
<div class="tip"><b>今日のゴール</b>「演習」から5要素クイズを解いて、勘定科目がどのグループかを即答できるようにしましょう。</div>
`);

<h3>三分法</h3>

<h3>仕入れたとき</h3>
[[仕入:50000/買掛金:50000]]
<p>代金後払い＝<strong>買掛金</strong>（負債）。現金払いなら現金、小切手を振り出したら<strong>当座預金</strong>。</p>
<h3>売り上げたとき</h3>
[[売掛金:80000/売上:80000]]
<p>代金後で受取＝<strong>売掛金</strong>（資産）。他人振出の小切手を受け取ったら<strong>現金</strong>。</p>
<h3>諸掛り（運賃など）</h3>
<ul><li><strong>仕入側の引取運賃</strong>（当社負担）→仕入に含める</li></ul>

<h3>返品</h3>
<p>返品は元の仕訳を<strong>逆にする</strong>だけ。</p>
[[買掛金:5000/仕入:5000]]
[[売上:3000/売掛金:3000]]
<div class="tip"><b>ここが出る</b>「他店振出の小切手」＝現金、「小切手を振り出した」＝当座預金。この区別は毎回のように出ます。</div>
`);

lesson("L4","現金・現金過不足・小口現金","通貨代用証券と過不足処理",["t3"],`
<h3>簿記の「現金」</h3>
<p>紙幣・硬貨のほか、<strong>他人振出の小切手、送金小切手、郵便為替証書</strong>も現金として扱います。</p>

<div class="tip"><b>ここが出る</b>決算日に初めて不足が見つかった場合は現金過不足を使わず、直接「雑損（雑益）」で処理します。</div>

lesson("L5","預金と当座借越","当座・普通・定期",["t4"],`

[[普通預金:200/受取利息:200]]

lesson("L8","固定資産","取得・減価償却・売却",["t7"],`
<h3>取得</h3>
<p>建物・備品・車両運搬具・土地。<strong>購入代価＋付随費用</strong>（仲介手数料・登記料・据付費・整地費用など）が取得原価。</p>

lesson("L11","経過勘定・貯蔵品・訂正仕訳","前払・前受・未払・未収",["t10"],`
<h3>経過勘定の4パターン</h3>
<p>お金の受け払いと「当期の費用・収益」のズレを決算で調整します。</p>
<div class="tbl"><table><tr><th>状況</th><th>仕訳</th><th>B/S表示</th></tr>
<tr><td>費用を前払い（次期分）</td><td>前払保険料／保険料</td><td>前払費用（資産）</td></tr>
<tr><td>費用が未払い（当期分）</td><td>支払家賃／未払家賃</td><td>未払費用（負債）</td></tr>
<tr><td>収益を前受け（次期分）</td><td>受取地代／前受地代</td><td>前受収益（負債）</td></tr>
<tr><td>収益が未収（当期分）</td><td>未収利息／受取利息</td><td>未収収益（資産）</td></tr></table></div>
<div class="tip"><b>コツ</b>まず「費用・収益をどちらに動かすか」を決める。次期分なら当期から減らす、当期分なら当期に足す。相手が経過勘定。</div>
<h3>月数計算</h3>
<p>会計期間4/1〜3/31、8/1に1年分¥120,000支払い→当期は8〜3月の8か月、未経過は4〜7月の4か月。</p>
[[前払保険料:40000/保険料:40000]]
<h3>再振替仕訳</h3>
<p>翌期首に、決算整理仕訳と<strong>貸借逆</strong>の仕訳をして元の勘定に戻します。</p>
[[保険料:30000/前払保険料:30000]]
<h3>貯蔵品</h3>
<p>決算時に未使用の切手・収入印紙は<strong>貯蔵品</strong>（資産）へ。</p>
[[貯蔵品:3000/通信費:3000]]
<h3>差入保証金</h3>
<p>敷金は返ってくるので<strong>差入保証金</strong>（資産）。仲介手数料は支払手数料。</p>
<h3>訂正仕訳</h3>
<ol><li>誤った仕訳を書く</li><li>その逆仕訳（取消し）を書く</li><li>正しい仕訳を書く</li><li>2と3をまとめる</li></ol>
<p>貸借逆の誤りは「正しい仕訳の金額×2」になります。</p>
`);
lesson("L12","帳簿と補助簿","補助簿の選択・商品有高帳",[],`
<h3>主要簿と補助簿</h3>
<ul><li><strong>主要簿</strong>：仕訳帳、総勘定元帳</li><li><strong>補助記入帳</strong>：現金出納帳、当座預金出納帳、小口現金出納帳、仕入帳、売上帳、受取手形記入帳、支払手形記入帳</li><li><strong>補助元帳</strong>：売掛金元帳（得意先元帳）、買掛金元帳（仕入先元帳）、商品有高帳、固定資産台帳</li></ul>
<h3>補助簿の選択（第2問の定番）</h3>
<p>仕訳を書いて、出てきた科目から帳簿を選びます。</p>
<div class="tbl"><table><tr><th>仕訳に出る科目</th><th>記入する補助簿</th></tr>
<tr><td>現金</td><td>現金出納帳</td></tr><tr><td>当座預金</td><td>当座預金出納帳</td></tr>
<tr><td>売掛金</td><td>売掛金元帳</td></tr><tr><td>買掛金</td><td>買掛金元帳</td></tr>
<tr><td>受取手形／支払手形</td><td>受取手形記入帳／支払手形記入帳</td></tr>
<tr><td>仕入</td><td>仕入帳＋<strong>商品有高帳</strong></td></tr>
<tr><td>売上</td><td>売上帳＋<strong>商品有高帳</strong></td></tr>
<tr><td>建物・備品・土地など</td><td>固定資産台帳</td></tr></table></div>
<div class="warn">仕入・売上には商品の数量が動くので商品有高帳もセット。引取運賃を現金で払ったら現金出納帳も。</div>
<h3>商品有高帳</h3>
<p>商品の種類ごとに受入・払出・残高を<strong>原価</strong>で記録します（売価ではない）。</p>
<p><strong>先入先出法</strong>：先に仕入れたものから払い出す。<br><strong>移動平均法</strong>：仕入のたびに平均単価＝（残高金額＋仕入金額）÷（残高数量＋仕入数量）。</p>
<div class="tip"><b>例</b>前月繰越10個@100、仕入20個@130 → 移動平均単価＝(1,000＋2,600)÷30＝@120。15個売ると払出原価は1,800。</div>
<p>売上総利益＝売上高（売価）−売上原価（払出原価合計）。</p>
`);
lesson("L13","伝票と証ひょう","三伝票制",[],`
<h3>三伝票制</h3>
<ul><li><strong>入金伝票</strong>：現金が増える取引。借方は必ず現金なので、貸方科目だけ書く</li><li><strong>出金伝票</strong>：現金が減る取引。借方科目だけ書く</li><li><strong>振替伝票</strong>：現金が動かない取引。仕訳そのまま</li></ul>
<h3>一部現金取引</h3>
<p>例：商品¥100,000を売り上げ、¥30,000は現金、残りは掛け。</p>
<p>①取引を分ける方法</p>
<p>入金伝票（売上 30,000）＋振替伝票（売掛金70,000／売上70,000）</p>
<p>②全額を掛けとみなす方法</p>
<p>振替伝票（売掛金100,000／売上100,000）＋入金伝票（売掛金 30,000）</p>
<div class="tip"><b>解き方</b>振替伝票の金額を見て、どちらの方法か判断する。</div>
<h3>証ひょう</h3>

  return `<input class="in ${cls}" id="v-${key}-${name}" data-v="${key}|${name}" inputmode="numeric" autocomplete="off" placeholder="金額" value="${v?n2(v):""}" ${graded?"disabled":""} style="${graded?(ok?"border-color:var(--ok);background:var(--ok-soft)":"border-color:var(--ng);background:var(--ng-soft)"):""}">${graded&&!ok?`<span class="ans-note">正解 ${n2(Math.abs(correct))}</span>`:""}`;
}
function q2HTML(o,key,graded){
  let h=`<div class="stack"><div class="sheet stack"><div class="row between"><h3>問1 補助簿の選択</h3><span class="chip plain">10点</span></div><p class="small muted">各取引が記入される補助簿をすべて選んでください（各2点・完全一致）。</p>`;
  o.a.items.forEach((it,i)=>{const sel=vget(key,"b"+i)||[];
    h+=`<div class="stack" style="gap:6px;padding-top:8px;border-top:1px solid var(--rule)"><p><b class="num">(${i+1})</b> ${it.t}</p><div class="opts">${BOOKS.map(b=>{let c="opt";const on=sel.includes(b);if(graded){if(it.b.includes(b))c+=" right";else if(on)c+=" wrong";}else if(on)c+=" on";return `<button class="${c}" data-chip="${key}|b${i}|${b}" ${graded?"disabled":""}>${b}</button>`;}).join("")}</div></div>`;});
  h+="</div>";
  const b=o.b;
  h+=`<div class="sheet stack"><div class="row between"><h3>問2 ${b.type==="inv"?"商品有高帳":b.type==="pre"?"保険料勘定の記入":"語句の選択"}</h3><span class="chip plain">10点</span></div>`;
  if(b.type==="inv"){
    h+=`<p class="small">次のA商品の4月の取引について、<b>${b.method==="fifo"?"先入先出法":"移動平均法"}</b>で商品有高帳を記入したとして、下の金額を答えなさい。売上の単価は売価である。</p><div class="tbl"><table><tr><th>日付</th><th>摘要</th><th>数量</th><th>単価</th></tr>${b.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]}個</td><td class="r">${n2(r[3])}</td></tr>`).join("")}</table></div>`;
    h+=`<div class="fs">${b.blanks.map(([k,lab,v])=>`<div class="fl"><div class="lab">${lab}</div><div>${numInput(key,k,graded,v)}</div></div>`).join("")}</div>`;
  }else if(b.type==="pre"){
    h+=`<p class="small">当社（決算日3月31日）は、毎年${b.m}月1日に向こう1年分の保険料を普通預金から支払っている。前期の支払額は${yen(b.X0)}、当期（×1年${b.m}月1日）の支払額は${yen(b.X1)}である。経過勘定は期首に再振替している。保険料勘定の空欄①〜③と④に答えなさい。</p>
    <div class="ttl" style="text-align:center;font-weight:700;margin-top:6px">保険料</div><div class="tacc"><div>
      <div class="tline"><span class="lab">4/1 前払保険料</span>${numInput(key,"prev",graded,b.blanks[0][2])}</div>
      <div class="tline"><span class="lab">${b.m}/1 普通預金</span><span class="v">${n2(b.X1)}</span></div></div><div>
      <div class="tline"><span class="lab">3/31 前払保険料</span>${numInput(key,"cur",graded,b.blanks[1][2])}</div>
      <div class="tline"><span class="lab">3/31 損益</span>${numInput(key,"exp",graded,b.blanks[2][2])}</div></div></div>
      <p style="margin-top:8px">${b.mc.q}</p><div class="opts">${b.mc.o.map(x=>{const on=vget(key,"mc")===x;let c="opt";if(graded){if(x===b.mc.a)c+=" right";else if(on)c+=" wrong";}else if(on)c+=" on";return `<button class="${c}" data-mc="${key}|mc|${x}" ${graded?"disabled":""}>${x}</button>`;}).join("")}</div>`;
  }else{
    b.items.forEach((it,i)=>{h+=`<div class="stack" style="gap:6px;padding-top:8px;border-top:1px solid var(--rule)"><p><b class="num">(${i+1})</b> ${it.q}</p><div class="opts">${it.o.map(x=>{const on=vget(key,"t"+i)===x;let c="opt";if(graded){if(x===it.a)c+=" right";else if(on)c+=" wrong";}else if(on)c+=" on";return `<button class="${c}" data-mc="${key}|t${i}|${x}" ${graded?"disabled":""}>${x}</button>`;}).join("")}</div></div>`;});
  }
  h+="</div></div>";return h;
}
function gradeQ2(o,key){
  let s1=0;o.a.items.forEach((it,i)=>{const sel=(vget(key,"b"+i)||[]).slice().sort().join();if(sel===it.b.slice().sort().join())s1+=2;});
  const b=o.b;let s2=0;
  const eqv=(k,v)=>{const x=vget(key,k);return x!==undefined&&x!==""&&+x===v;};
  if(b.type==="inv")s2=b.blanks.filter(([k,,v])=>eqv(k,v)).length*2.5;
  else if(b.type==="pre")s2=b.blanks.filter(([k,,v])=>eqv(k,v)).length*2.5+(vget(key,"mc")===b.mc.a?2.5:0);
  else s2=b.items.filter((it,i)=>vget(key,"t"+i)===it.a).length*2;
  return {s1,s2,total:s1+s2};
}
function filledQ2(o,key){const v=VALS[key];return v&&Object.keys(v).length>0;}
function q3HTML(o,key,graded,hints){
  let h=`<div class="stack"><div class="sheet stack"><p class="small">次の決算整理前残高試算表と決算整理事項にもとづいて、貸借対照表と損益計算書の空欄に金額を入れなさい。会計期間は×1年4月1日〜×2年3月31日。貸倒引当金・減価償却累計額は正の数で入力してよい。</p>
  <h3>決算整理前残高試算表</h3><div class="tbl"><table><tr><th style="text-align:right">借方</th><th>勘定科目</th><th style="text-align:right">貸方</th></tr>${o.tb.map(r=>`<tr><td class="r">${r[1]?n2(r[1]):""}</td><td>${r[0]}</td><td class="r">${r[2]?n2(r[2]):""}</td></tr>`).join("")}<tr><th class="r">${n2(o.tb.reduce((s,r)=>s+r[1],0))}</th><th></th><th class="r">${n2(o.tb.reduce((s,r)=>s+r[2],0))}</th></tr></table></div>
  <h3>決算整理事項</h3><ol class="adj">${o.adj.map((a,i)=>`<li><div>${a}${hints&&hints[i]?`<div style="margin-top:4px">${jtable(parseAns(o.expl[i][0]))}<p class="small muted">${o.expl[i][1]}</p></div>`:""}${!graded&&hints?`<button class="ghost small" data-act="hint" data-i="${i}">${hints[i]?"ヒントを閉じる":"ヒント（仕訳）を見る"}</button>`:""}</div></li>`).join("")}</ol></div>`;
  const sec=(title,groups)=>{let s=`<div class="sheet"><h3>${title}</h3><div class="fs">`;for(const g of groups){s+=`<div class="fh">${g.h}</div>`;for(const l of g.lines){const bl=o.blanks.includes(l.k);s+=`<div class="fl${l.ind?" indent":""}${bl?" bl":""}"><div class="lab">${l.lab}</div><div class="val">${bl?numInput(key,l.k,graded,l.v):(l.v<0?"△"+n2(-l.v):n2(l.v))}</div></div>`;}}return s+"</div></div>";};
  h+=sec("貸借対照表（×2年3月31日）",o.bs)+sec("損益計算書（×1年4月1日〜×2年3月31日）",o.pl);
  if(graded){h+=`<div class="sheet stack"><h3>解説：決算整理仕訳</h3>${o.adj.map((a,i)=>`<div><p class="small"><b class="num">${i+1}.</b> ${a}</p>${jtable(parseAns(o.expl[i][0]))}${o.expl[i][1]?`<p class="small muted">${o.expl[i][1]}</p>`:""}</div>`).join("")}</div>`;}
  return h+"</div>";
}
function gradeQ3(o,key){let n=0;const all=[...o.bs,...o.pl].flatMap(g=>g.lines);for(const k of o.blanks){const l=all.find(x=>x.k===k);const v=vget(key,k);if(v!==undefined&&v!==""&&Math.abs(+v)===Math.abs(l.v))n++;}return {n,of:o.blanks.length,total:Math.round(n*35/o.blanks.length*10)/10};}

let TAB="home",VIEW={name:"home"},SESSION=null,MOCK=null,RESULT=null,SELDAY=null,CONFIRM=false;
function calDay(){return Math.min(30,Math.max(1,diffDays(S.start,today())+1));}
function curDay(){for(let d=1;d<=30;d++){const pr=dayProgress(d);if(pr.n<pr.of)return d;}return 30;}
function allDone(){return PLAN.every((_,i)=>{const pr=dayProgress(i+1);return pr.n===pr.of;});}
function doneToday(){return Object.values(S.doneAt||{}).filter(x=>x===today()).length;}
function paceChip(){const diff=(allDone()?31:curDay())-calDay();if(diff>0)return `<span class="chip ok">予定より${diff}日先行</span>`;if(diff<0)return `<span class="chip ng">予定より${-diff}日遅れ</span>`;return `<span class="chip plain">予定どおり</span>`;}
function taskInfo(k){
  switch(k[0]){
    case "lesson":{const l=L.find(x=>x.id===k[1]);return {t:"講義："+l.title,s:l.sub,btn:"読む"};}
    case "class":return {t:"5要素クイズ",s:k[1]+"問・勘定科目のグループ分け",btn:"解く"};
    case "drill":return {t:"仕訳ドリル："+(k[1].length>3?"総合":k[1].map(t=>TOPICS[t]).join("・")),s:k[2]+"問",btn:"解く"};
    case "review":{const n=dueList().length;return {t:"今日の復習",s:n?n+"問が復習のタイミング":"復習待ちの問題はありません",btn:"復習"};}
    case "weak":return {t:"弱点問題",s:"間違えた問題から"+k[1]+"問",btn:"解く"};
    case "q2":return {t:"第2問ドリル",s:"補助簿・帳簿記入 1セット（20点）",btn:"解く"};
    case "q3":return {t:"第3問ドリル",s:"財務諸表 1セット（35点）・ヒント付き",btn:"解く"};
    case "mock":return {t:"模擬試験（60分）",s:"第1〜3問・100点満点",btn:"開始"};
  }
}
function dayProgress(d){const p=PLAN[d-1];const done=S.days[d]||{};const n=p.k.filter((k,i)=>done[i]).length;return {n,of:p.k.length};}
function render(){
  document.body.classList.toggle("mocking",!!MOCK&&VIEW.name==="mock-run");

}

/* ---- セッション ---- */
function startSession(kind,opt={}){
  let items=[],title="";
  if(kind==="drill"||kind==="topic"){const tp=opt.topics||[opt.t];items=pickQs(tp,opt.n||10).map(q=>({type:"j",q}));title=tp.length>3?"仕訳ドリル（総合）":"仕訳："+tp.map(t=>TOPICS[t]).join("・");}
  else if(kind==="review"){items=shuffle(dueList()).slice(0,opt.n||30).map(q=>({type:"j",q}));title="今日の復習";}
  else if(kind==="weak"){items=weakList().slice(0,opt.n||15).map(q=>({type:"j",q}));items=shuffle(items);title="弱点問題";}
  else if(kind==="rand15"){items=mockQ1().map(q=>({type:"j",q}));title="仕訳15問";}
  else if(kind==="class"){const ac=shuffle(Object.keys(CAT).filter(a=>CAT[a]!=="その他")).slice(0,opt.n||10);items=ac.map(a=>({type:"class",a}));title="5要素クイズ";}
  else if(kind==="q2"){items=[{type:"q2",o:genQ2()}];title="第2問ドリル";}
  else if(kind==="q3"){items=[{type:"q3",o:genQ3(),hints:{}}];title="第3問ドリル";}
  if(!items.length){SESSION=null;return;}
  items.forEach((it,i)=>{it.key="s"+Date.now().toString(36)+i;if(it.type==="j")it.choices=choicesFor(it.q);});
  SESSION={title,items,i:0,ok:0,task:opt.task||null,graded:false};go("session");
}
function vSession(){
  const s=SESSION;const it=s.items[s.i];if(!it)return vSessionDone();
  let h=`<div class="stack" style="gap:14px"><div class="progress"><button class="ghost small" data-act="quit">✕ 中断</button><div class="meter"><i style="width:${s.i/s.items.length*100}%"></i></div><span class="num small">${s.i+1}/${s.items.length}</span></div><div class="eyebrow">${s.title}</div>`;
  if(it.type==="j"){

function trend(ms){const W=320,H=120,P=24;const pts=ms.slice(-10);const x=i=>P+(pts.length===1?(W-2*P)/2:i*(W-2*P)/(pts.length-1));const y=v=>H-P/1.5-(v/100)*(H-P*1.4);
  let s=`<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="模試の得点推移"><line x1="${P}" x2="${W-P}" y1="${y(70)}" y2="${y(70)}" stroke="var(--stamp)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-P}" y="${y(70)-4}" text-anchor="end" font-size="10" fill="var(--stamp)">合格 70</text>`;
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((m,i)=>x(i)+","+y(m.total)).join(" ")}"/>`;
  s+=pts.map((m,i)=>`<circle cx="${x(i)}" cy="${y(m.total)}" r="${i===pts.length-1?5:3.5}" fill="${m.total>=70?"var(--accent)":"var(--card)"}" stroke="var(--accent)" stroke-width="2"/><text x="${x(i)}" y="${y(m.total)-9}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="IBM Plex Mono,monospace">${m.total}</text>`).join("");
  return s+"</svg>";}

/* ============ 操作 ============ */
function markTask(t){const d=t.d,i=t.i;S.days[d]=S.days[d]||{};S.days[d][i]=true;S.doneAt=S.doneAt||{};const pr=dayProgress(d);if(pr.n===pr.of&&!S.doneAt[d])S.doneAt[d]=today();}
function runTask(d,i){
  const k=PLAN[d-1].k[i];const task={d,i};
  switch(k[0]){
    case "lesson":go("lesson",{id:k[1],task});break;
    case "class":startSession("class",{n:k[1],task});break;
    case "drill":startSession("drill",{topics:k[1],n:k[2],task});break;
    case "review":if(!dueList().length){markTask(task);save();render();}else startSession("review",{task});break;
    case "weak":if(!weakList().length){startSession("drill",{topics:ALLT,n:k[1],task});}else startSession("weak",{n:k[1],task});break;
    case "q2":startSession("q2",{task});break;
    case "q3":startSession("q3",{task});break;
    case "mock":TAB="mock";startMock(task);break;
  }
}
document.addEventListener("click",e=>{
  const tb=e.target.closest("#tabs button");if(tb){TAB=tb.dataset.tab;CONFIRM=false;go(TAB);return;}
  const chip=e.target.closest("[data-chip]");if(chip){const [k,n,b]=chip.dataset.chip.split("|");VALS[k]=VALS[k]||{};const a=VALS[k][n]||[];VALS[k][n]=a.includes(b)?a.filter(x=>x!==b):a.concat(b);chip.classList.toggle("on");if(MOCK)saveMock();return;}
  const mc=e.target.closest("[data-mc]");if(mc){const [k,n,x]=mc.dataset.mc.split("|");VALS[k]=VALS[k]||{};VALS[k][n]=x;mc.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.toggle("on",o===mc));if(MOCK)saveMock();return;}
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  switch(a){
    case "tab":TAB=el.dataset.tab;go(TAB);break;
    case "selday":SELDAY=+el.dataset.d;render();break;
    case "task":runTask(+el.dataset.d,+el.dataset.i);break;
    case "lesson":TAB="learn";go("lesson",{id:el.dataset.id});break;
    case "read":{S.read[el.dataset.id]=true;if(VIEW.task)markTask(VIEW.task);else{PLAN.forEach((p,di)=>p.k.forEach((k,ki)=>{if(k[0]==="lesson"&&k[1]===el.dataset.id&&di+1<=curDay()){markTask({d:di+1,i:ki});}}));}save();render();break;}
    case "ldrill":{const l=L.find(x=>x.id===el.dataset.id);startSession("drill",{topics:l.topics,n:30});break;}
    case "start":{const k=el.dataset.kind;if(k==="topic")startSession("topic",{t:el.dataset.t,n:30});else startSession(k,{});break;}
    case "addrow":{const st=FORMS[el.dataset.key];if(st&&st.rows<5){st.rows++;render();}break;}
    case "answer":{const s=SESSION,it=s.items[s.i];
      if(it.type==="j"){it.ok=gradeJ(it.key,it.q);recordQ(it.q.id,it.ok);if(it.ok)s.ok++;}
      else if(it.type==="q2"){it.g=gradeQ2(it.o,it.key);S.q2.push(it.g.total);logOne();}
      else if(it.type==="q3"){it.g=gradeQ3(it.o,it.key);S.q3.push(it.g.total);logOne();}
      s.graded=true;save();render();break;}
    case "giveup":{const s=SESSION,it=s.items[s.i];it.ok=false;recordQ(it.q.id,false);s.graded=true;save();render();break;}
    case "cls":{const s=SESSION,it=s.items[s.i];it.pick=el.dataset.c;it.ok=CAT[it.a]===it.pick;if(it.ok){s.ok++;S.cls.c++;}else S.cls.w++;logOne();s.graded=true;save();render();break;}
    case "hint":{const it=SESSION.items[SESSION.i];const i=+el.dataset.i;it.hints[i]=!it.hints[i];render();break;}
    case "next":SESSION.i++;SESSION.graded=false;if(SESSION.i>=SESSION.items.length&&SESSION.task){markTask(SESSION.task);save();}render();window.scrollTo(0,0);break;
    case "quit":SESSION=null;go(TAB);break;
    case "finish":SESSION=null;SELDAY=null;TAB="home";go("home");break;
    case "mockstart":startMock(null);break;
    case "resume":resumeMock();break;
    case "mnav":MOCK.cur=Math.min(16,+el.dataset.i);CONFIRM=false;saveMock();render();window.scrollTo(0,0);break;
    case "msubmit":CONFIRM=true;render();window.scrollTo(0,0);break;
    case "mcancel":CONFIRM=false;render();break;
    case "mgrade":gradeMock();break;
    case "settings":TAB="home";CONFIRM=false;go("settings");break;
    case "saveset":{const s=$("#set-start").value,x=$("#set-exam").value;if(s)S.start=s;if(x)S.exam=x;save();go("home");break;}
    case "export":{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const u=URL.createObjectURL(blob);const x=document.createElement("a");x.href=u;x.download="boki3-backup-"+today()+".json";document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(err){}break;}
    case "copyb":{const t=JSON.stringify(S);const box=$("#bk");box.value=t;const m=$("#bkmsg");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{m.textContent="コピーしました。メモアプリなどに貼って保管してください。";},()=>{box.select();m.textContent="上の欄のコードを選択してコピーしてください。";});break;}
    case "importb":{const m=$("#bkmsg");try{const r=JSON.parse($("#bk").value.trim());if(!r||!r.qs||!r.start)throw 0;S=Object.assign(fresh(),r);save();m.textContent="復元しました。";go("home");}catch(err){m.textContent="コードを読み取れませんでした。全体をコピーできているか確認してください。";}break;}
    case "askreset":CONFIRM=true;render();break;
    case "reset":S=fresh();save();CONFIRM=false;SELDAY=null;go("home");break;
  }
});
function onField(e,final){
  const t=e.target;
  if(t.dataset.f){const [k,side,i,f]=t.dataset.f.split("|");const st=FORMS[k];if(!st)return;st[side][i]=st[side][i]||{acc:"",amt:""};
    if(f==="acc")st[side][i].acc=t.value;else{const d=t.value.replace(/[^\d]/g,"");st[side][i].amt=d?+d:"";if(final)t.value=d?n2(+d):"";}
    if(MOCK)saveMock();}
  else if(t.dataset.v){const [k,n]=t.dataset.v.split("|");VALS[k]=VALS[k]||{};const d=t.value.replace(/[^\d]/g,"");VALS[k][n]=d?+d:"";if(final)t.value=d?n2(+d):"";if(MOCK)saveMock();}
}
document.addEventListener("input",e=>onField(e,false));
document.addEventListener("change",e=>{if(e.target.id!=="bkfile"||!e.target.files[0])return;const fr=new FileReader();fr.onload=()=>{$("#bk").value=fr.result;document.querySelector('[data-act="importb"]').click();};fr.readAsText(e.target.files[0]);});
document.addEventListener("change",e=>onField(e,true));
document.addEventListener("focusout",e=>{if(e.target.matches("input.in"))onField(e,true);});

/* ============ 起動 ============ */
if(!S.updatedAt){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}}
if(loadMock()){TAB="mock";}
go(TAB==="mock"?"mock":"home");
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
